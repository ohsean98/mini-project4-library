version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - chmod +x ./gradlew
  build:
    commands:
      - ./gradlew clean build -x test
  post_build:
    commands:
      - echo Copying deployment configuration files...
      - cp appspec-backend.yml appspec.yml
      - cp -r deploy-scripts scripts || true

artifacts:
  files:
    - 'build/libs/*.jar'     # jar 파일 경로 유지
    - 'appspec.yml'          # 복사된 appspec.yml을 확실하게 포함
    - 'scripts/**/*'         # 복사된 scripts 폴더 전체 포함
  discard-paths: yes         # 모든 파일들을 최상위 루트에 모아서 압축