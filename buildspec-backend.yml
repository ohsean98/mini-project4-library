version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - chmod +x ./gradlew
  build:
    commands:
      - echo Backend build started on `date`
      - ./gradlew clean build -x test
  post_build:
    commands:
      - echo Creating clean deployment package...
      # 1. 배포에 필요한 것만 모을 폴더 생성
      mkdir -p deploy-package/scripts
      
      # 2. 빌드된 jar 파일을 배포 폴더로 복사
      cp build/libs/*.jar deploy-package/
      
      # 3. appspec-backend.yml을 appspec.yml 이름으로 변경하여 배포 폴더로 복사
      cp appspec-backend.yml deploy-package/appspec.yml
      
      # 4. deploy-scripts 안에 있는 쉘 스크립트들을 배포 폴더 안의 scripts 폴더로 복사
      cp -r deploy-scripts/* deploy-package/scripts/ || true

artifacts:
  files:
    - '**/*'
  # 🌟 중요: deploy-package 내부의 구조를 그대로 유지한 채 이 폴더를 루트 삼아 압축합니다.
  base-directory: deploy-package