version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - echo "Granting execute permission to gradlew inside bookapp..."
      - chmod +x $CODEBUILD_SRC_DIR/bookapp/gradlew
  build:
    commands:
      - echo "Moving to bookapp and starting build..."
      - cd $CODEBUILD_SRC_DIR/bookapp
      - ./gradlew clean build -x test
  post_build:
    commands:
      - echo "Creating clean deployment package using absolute paths..."
      # 1. 아티팩트로 내보낼 패키지 폴더 세팅
      - mkdir -p $CODEBUILD_SRC_DIR/deploy-package/scripts
      
      # 2. 빌드 완료된 jar 파일을 패키지 폴더로 복사
      - cp $CODEBUILD_SRC_DIR/bookapp/build/libs/*.jar $CODEBUILD_SRC_DIR/deploy-package/
      
      # 3. 최상위에 있는 appspec-backend.yml을 appspec.yml로 이름을 변경해 패키지 폴더 루트에 저장
      - cp $CODEBUILD_SRC_DIR/appspec-backend.yml $CODEBUILD_SRC_DIR/deploy-package/appspec.yml
      
      # 4. 최상위에 있는 deploy-scripts 폴더의 모든 sh 스크립트들을 패키지 폴더의 scripts 내부로 복사
      - cp -r $CODEBUILD_SRC_DIR/deploy-scripts/* $CODEBUILD_SRC_DIR/deploy-package/scripts/ || true

artifacts:
  files:
    - '**/*'
  # 🌟 중요: deploy-package를 베이스 디렉토리로 잡아야 압축 파일 해제 시 루트에 appspec.yml이 바로 노출됩니다.
  base-directory: deploy-package